name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: 运行测试
        run: uv run pytest tests/ -q
      - name: 静态检查
        run: uv run ruff check forge/ tests/
